name: Monitor Semua Workflow
on:
  workflow_run:
    workflows: 
      - "Update Weather"
      - "Metrics"
      - "Update Meme Image"
      - "Update Quotes"
      - "Update Server Tips"
    types:
      - completed

permissions:
  actions: read

jobs:
  kirim-notifikasi-discord:
    runs-on: ubuntu-slim
    steps:
      - name: Atur Format Notifikasi Berdasarkan Karakter Fatui
        id: format
        run: |
          CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          TRIGGER_EVENT="${{ github.event.workflow_run.event }}"
          
          # 1. LOGIKA UTAMA: MEMISAHKAN COLUMBINA (SUCCESS) & ARLECCHINO (FAILURE)
          if [ "$CONCLUSION" = "success" ]; then
            # --- KONFIGURASI COLUMBINA ---
            echo "TARGET_WEBHOOK=${{ secrets.DISCORD_WEBHOOK }}" >> $GITHUB_OUTPUT
            echo "TITLE=♫~ Ah, keharmonisan yang indah..." >> $GITHUB_OUTPUT
            echo "DESC=Semuanya berjalan dengan sangat damai, bagai melodi yang mengalun tanpa cela... Alur kerjamu menari dengan sempurna hari ini.~" >> $GITHUB_OUTPUT
            echo "COLOR=16764142" >> $GITHUB_OUTPUT # Warna Pink Lembut
            echo "FOOTER=🕊️ \"Tidurlah dengan damai, biarkan malam menghapus air matamu...\"" >> $GITHUB_OUTPUT
            
            # Penerjemah Pemicu versi Columbina
            if [ "$TRIGGER_EVENT" = "schedule" ]; then
              echo "POETIC_TRIGGER=⏰ *Takdir waktu yang berputar rutin (Penjadwalan Otomatis)*" >> $GITHUB_OUTPUT
            elif [ "$TRIGGER_EVENT" = "workflow_dispatch" ]; then
              echo "POETIC_TRIGGER=🖐️ *Sentuhan jemarimu yang menggerakkan takdir (Eksekusi Manual)*" >> $GITHUB_OUTPUT
            elif [ "$TRIGGER_EVENT" = "repository_dispatch" ]; then
              echo "POETIC_TRIGGER=🔄 *Alunan lagu lama yang terpaksa dimainkan ulang dari awal setelah sempat terputus (Otomatis Coba Lagi 5 Menit)*" >> $GITHUB_OUTPUT
            else
              echo "POETIC_TRIGGER=🍃 *Bisikan tak dikenal dari dimensi lain ($TRIGGER_EVENT)*" >> $GITHUB_OUTPUT
            fi
            
          else
            # --- KONFIGURASI ARLECCHINO ---
            echo "TARGET_WEBHOOK=${{ secrets.DISCORD_WEBHOOK_FAIL }}" >> $GITHUB_OUTPUT
            echo "TITLE=🩸 Laporan Kegagalan: House of the Hearth" >> $GITHUB_OUTPUT
            echo "DESC=Ada gangguan pada sistem kita. Salah satu alur kerja gagal menyelesaikan tugasnya. Di bawah pengawasanku, setiap kesalahan harus dievaluasi dengan tegas. Jangan biarkan kelalaian ini terulang kembali." >> $GITHUB_OUTPUT
            echo "COLOR=10038562" >> $GITHUB_OUTPUT # Warna Merah Darah Gelap khas Arlecchino
            echo "FOOTER=🐦‍⬛ \"Di dalam kegelapan, kedisiplinan adalah satu-satunya cahaya yang tersisa.\"" >> $GITHUB_OUTPUT
            
            # Penerjemah Pemicu versi Arlecchino
            if [ "$TRIGGER_EVENT" = "schedule" ]; then
              echo "POETIC_TRIGGER=⚙️ *Siklus rutin yang terjadwal otomatis*" >> $GITHUB_OUTPUT
            elif [ "$TRIGGER_EVENT" = "workflow_dispatch" ]; then
              echo "POETIC_TRIGGER=♟️ *Perintah manual langsung darimu*" >> $GITHUB_OUTPUT
            elif [ "$TRIGGER_EVENT" = "repository_dispatch" ]; then
              echo "POETIC_TRIGGER=⏳ *Sistem mencoba bangkit kembali dari kegerhanaan (Otomatis Coba Lagi 5 Menit)*" >> $GITHUB_OUTPUT
            else
              echo "POETIC_TRIGGER=⛓️ *Intervensi dari faktor luar ($TRIGGER_EVENT)*" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Kirim Notifikasi ke Target Discord
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{
                 "embeds": [{
                   "title": "${{ steps.format.outputs.TITLE }}",
                   "description": "${{ steps.format.outputs.DESC }}",
                   "color": ${{ steps.format.outputs.COLOR }},
                   "fields": [
                     {
                       "name": "🏰 Tempat Melodi Bergema",
                       "value": "[${{ github.repository }}](https://github.com{{ github.repository }})",
                       "inline": false
                     },
                     {
                       "name": "✨ Melodi yang Dimainkan",
                       "value": "`${{ github.event.workflow_run.name }}`",
                       "inline": true
                     },
                     {
                       "name": "👁️ Catatan Akhir",
                       "value": "`${{ github.event.workflow_run.conclusion }}`",
                       "inline": true
                     },
                     {
                       "name": "🍃 Bisikan Angin Pemicu",
                       "value": "${{ steps.format.outputs.POETIC_TRIGGER }}\n*(Pertunjukan ke-${{ github.event.workflow_run.run_number }})*",
                       "inline": false
                     },
                     {
                       "name": "🔗 Intip Takdir di Sini",
                       "value": "[Lihat lembaran catatan takdir di sini...](${{ github.event.workflow_run.html_url }})",
                       "inline": false
                     }
                   ],
                   "footer": {
                     "text": "${{ steps.format.outputs.FOOTER }}"
                   }
                 }]
               }' \
               "${{ steps.format.outputs.TARGET_WEBHOOK }}"
