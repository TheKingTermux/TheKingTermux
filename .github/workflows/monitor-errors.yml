name: Monitor Semua Error Workflow
on:
  workflow_run:
    workflows: 
      - "Update Weather"
      - "Metrics"
      - "Update Meme Image"
      - "Update Quotes"
      - "Update Server Tips"
    types:
      - completed

permissions:
  actions: read

jobs:
  kirim-notifikasi-discord:
    runs-on: ubuntu-slim
    # Hapus kondisi "if: failure" di tingkat job agar semua status (sukses/gagal) selalu diproses
    steps:
      - name: Atur Format Notifikasi Berdasarkan Status
        id: format
        run: |
          CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          
          if [ "$CONCLUSION" = "success" ]; then
            echo "TITLE=✅ Alur Kerja Berhasil!" >> $GITHUB_OUTPUT
            echo "DESC=Sistem otomatis telah selesai mengecek dan mengeksekusi alur kerja Anda dengan sukses tanpa kendala." >> $GITHUB_OUTPUT
            echo "COLOR=65280" >> $GITHUB_OUTPUT # Warna Hijau (Decimal)
          else
            echo "TITLE=❌ Alur Kerja Bermasalah!" >> $GITHUB_OUTPUT
            echo "DESC=Sistem otomatis mendeteksi adanya kegagalan eksekusi pada salah satu alur kerja repositori Anda." >> $GITHUB_OUTPUT
            echo "COLOR=16711680" >> $GITHUB_OUTPUT # Warna Merah (Decimal)
          fi

      - name: Kirim Notifikasi ke Discord
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{
                 "embeds": [{
                   "title": "${{ steps.format.outputs.TITLE }}",
                   "description": "${{ steps.format.outputs.DESC }}",
                   "color": ${{ steps.format.outputs.COLOR }},
                   "fields": [
                     {
                       "name": "Nama Alur Kerja (Workflow)",
                       "value": "${{ github.event.workflow_run.name }}",
                       "inline": true
                     },
                     {
                       "name": "Status Akhir",
                       "value": "${{ github.event.workflow_run.conclusion }}",
                       "inline": true
                     },
                     {
                       "name": "Pemicu Sistem (Trigger)",
                       "value": "${{ github.event.workflow_run.event }}",
                       "inline": true
                     },
                     {
                       "name": "Nomor Run",
                       "value": "#${{ github.event.workflow_run.run_number }}",
                       "inline": true
                     },
                     {
                       "name": "Link Log Detail",
                       "value": "[Klik di sini untuk melihat detail](${{ github.event.workflow_run.html_url }})",
                       "inline": false
                     }
                   ]
                 }]
               }' \
               "${{ secrets.DISCORD_WEBHOOK }}"
