name: Monitor Pull Requests
on:
  pull_request:
    types: [opened, closed, reopened, synchronize]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  pull-requests: read
  issues: read

jobs:
  kirim-notifikasi-pr:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'issue_comment' || github.event.issue.pull_request != null }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Ambil Data Real-time PR dari GitHub API
        id: fetch_pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Tentukan nomor PR
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUM="${{ github.event.pull_request.number }}"
          elif [ "${{ github.event_name }}" = "pull_request_review" ] || [ "${{ github.event_name }}" = "pull_request_review_comment" ]; then
            PR_NUM="${{ github.event.pull_request.number || github.event.review.pull_request.number }}"
          else
            PR_NUM="${{ github.event.issue.number }}"
          fi

          echo "Mengambil dokumen audit untuk PR #$PR_NUM dari Jade Chamber..."
          
          # 2. Ambil data dari API
          PR_DATA=$(curl -s \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://github.com")

          # 3. KUNCI PERBAIKAN: Gunakan data API, jika kosong ambil langsung dari objek Event Context bawaan
          COMMITS=$(echo "$PR_DATA" | jq -r '.commits // empty')
          [ -z "$COMMITS" ] || [ "$COMMITS" = "null" ] && COMMITS="${{ github.event.pull_request.commits || github.event.review.pull_request.commits || '1' }}"

          FILES=$(echo "$PR_DATA" | jq -r '.changed_files // empty')
          [ -z "$FILES" ] || [ "$FILES" = "null" ] && FILES="${{ github.event.pull_request.changed_files || github.event.review.pull_request.changed_files || '1' }}"

          BRANCH=$(echo "$PR_DATA" | jq -r '.head.ref // empty')
          [ -z "$BRANCH" ] || [ "$BRANCH" = "null" ] && BRANCH="${{ github.event.pull_request.head.ref || github.event.review.pull_request.head.ref || 'main' }}"

          TITLE=$(echo "$PR_DATA" | jq -r '.title // empty')
          [ -z "$TITLE" ] || [ "$TITLE" = "null" ] && TITLE="${{ github.event.pull_request.title || github.event.review.pull_request.title || 'Proposal Transaksi PR' }}"

          HTML_URL=$(echo "$PR_DATA" | jq -r '.html_url // empty')
          if [ -z "$HTML_URL" ] || [ "$HTML_URL" = "null" ]; then
            HTML_URL="${{ github.server_url }}/$GITHUB_REPOSITORY/pull/$PR_NUM"
          fi

          # 4. Amankan data ke lingkungan ENV
          echo "TOTAL_COMMITS=$COMMITS" >> $GITHUB_ENV
          echo "CHANGED_FILES=$FILES" >> $GITHUB_ENV
          echo "PR_BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "PR_TITLE=$TITLE" >> $GITHUB_ENV
          echo "PR_HTML_URL=$HTML_URL" >> $GITHUB_ENV
          echo "PR_NUMBER=$PR_NUM" >> $GITHUB_ENV

      - name: Atur Payload Gaya Bisnis Ningguang
        id: format
        run: |
          EVENT_NAME="${{ github.event_name }}"
          ACTION="${{ github.event.action }}"
          echo "FOOTER=💎 'Setiap transaksi harus mendatangkan nilai keuntungan bagi Liyue.'" >> $GITHUB_ENV
          
          INDEX=$((RANDOM % 4))
          
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$ACTION" = "synchronize" ]; then
              echo "TITLE=🔄 Pembaruan Dokumen Kontrak: Amandemen Baru Masuk" >> $GITHUB_ENV
              echo "DESC=Mitra bisnis kita baru saja mengirimkan lembar amandemen kodingan baru ke dalam proposal ini. Jade Chamber akan langsung menghitung ulang nilai aset dan memeriksa statistik perubahan terbarunya." >> $GITHUB_ENV
            elif [ "$ACTION" = "opened" ]; then
              if [ $INDEX -eq 0 ]; then
                echo "TITLE=📜 Proposal Kontrak Kerja Baru Tiba" >> $GITHUB_ENV
                echo "DESC=Sebuah draf penggabungan kode baru telah diajukan ke Jade Chamber. Jika proposal investasi baris kode ini menguntungkan stabilitas proyek, saya akan segera menandatanganinya." >> $GITHUB_ENV
              elif [ $INDEX -eq 1 ]; then
                echo "TITLE=📈 Analisis Pasar: Peluang Investasi Kode" >> $GITHUB_ENV
                echo "DESC=Sekretarisku baru saja membawakan dokumen pengajuan kode ini. Mari kita bedah bersama, apakah kontribusi baru ini akan menaikkan nilai kapitalisasi repositori kita atau tidak." >> $GITHUB_ENV
              else
                echo "TITLE=🔍 Pemeriksaan Ketat Draf Perjanjian" >> $GITHUB_ENV
                echo "DESC=Jangan biarkan ada celah hukum atau bug sekecil apa pun lolos dari pengawasan Jade Chamber. Kita akan melakukan audit menyeluruh terhadap pengajuan baru ini." >> $GITHUB_ENV
              fi
            elif [ "$ACTION" = "closed" ]; then
              IS_MERGED="${{ github.event.pull_request.merged }}"
              if [ "$IS_MERGED" = "true" ]; then
                echo "TITLE=🤝 Kontrak Disetujui dan Disahkan" >> $GITHUB_ENV
                echo "DESC=Kesepakatan telah dicapai! Draf proposal ini resmi digabungkan ke dalam cabang utama. Kerja sama yang sangat menguntungkan." >> $GITHUB_ENV
              else
                echo "TITLE=❌ Proposal Kontrak Ditolak" >> $GITHUB_ENV
                echo "DESC=Setelah pertimbangan yang matang di Jade Chamber, investasi kode ini dinilai tidak membawa keuntungan bagi kestabilan proyek. Berkas dibatalkan." >> $GITHUB_ENV
              fi
            fi

          elif [ "$EVENT_NAME" = "pull_request_review" ]; then
            REVIEW_STATE="${{ github.event.review.state }}"
            if [ "$REVIEW_STATE" = "approved" ]; then
              echo "TITLE=✅ Audit Selesai: Kontrak Mendapat Sertifikasi Approved" >> $GITHUB_ENV
              echo "DESC=Kabar baik. Salah satu pengawas keuangan senior kita telah memeriksa struktur amandemen ini dan memberikan tanda sepakat. Jalan menuju merger semakin terbuka lebar." >> $GITHUB_ENV
            elif [ "$REVIEW_STATE" = "changes_requested" ]; then
              echo "TITLE=⚠️ Amandemen Ditolak Sementara: Changes Requested" >> $GITHUB_ENV
              echo "DESC=Tunggu dulu. Ditemukan poin audit yang cacat atau berisiko merugikan sistem. Dokumen dikembalikan ke meja pemohon untuk segera direvisi sesuai instruksi." >> $GITHUB_ENV
            else
              echo "TITLE=💬 Ulasan Catatan Berkas Transaksi" >> $GITHUB_ENV
              echo "DESC=Sebuah tinjauan umum tanpa putusan final baru saja ditambahkan pada lembar draf kerja ini. Evaluasi umum sedang berlangsung." >> $GITHUB_ENV
            fi

          else
            if [ $INDEX -eq 0 ]; then
              echo "TITLE=✍️ Catatan Koreksi di Lembar Lampiran" >> $GITHUB_ENV
              echo "DESC=Seseorang menambahkan tinta catatan kecil pada baris klausul dokumen kita. Mari kita teliti pesan koreksinya agar transaksi ini berjalan tanpa cacat." >> $GITHUB_ENV
            elif [ $INDEX -eq 1 ]; then
              echo "TITLE=⚖️ Diskusi Harga Aset: Negosiasi Kode" >> $GITHUB_ENV
              echo "DESC=Terjadi adu argumen sehat di ruang rapat mengenai efisiensi baris kode yang diajukan. Penyesuaian pendapat adalah hal biasa dalam bisnis." >> $GITHUB_ENV
            else
              echo "TITLE=💬 Bisikan Informasi Tambahan di Jade Chamber" >> $GITHUB_ENV
              echo "DESC=Sekretaris baru saja memperbarui log diskusi interaktif pada dokumen perjanjian komit ini. Meninjau masukan..." >> $GITHUB_ENV
            fi
          fi

      - name: Kirim Notifikasi via JQ
        env:
          DISCORD_URL: ${{ secrets.DISCORD_WEBHOOK_PR }}
        run: |
          if [ -z "$DISCORD_URL" ]; then
            echo "Error: DISCORD_WEBHOOK_PR kosong!"
            exit 1
          fi

          EVENT_NAME="${{ github.event_name }}"
          ACTION="${{ github.event.action }}"
          USER_ACTOR="${{ github.actor }}"
          
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$ACTION" = "synchronize" ]; then
              COMMENT_TEXT="Mengirimkan serangkaian revisi amandemen commit baru..."
            else
              COMMENT_TEXT="Menunggu peninjauan draf dokumen..."
            fi
            TARGET_URL="$PR_HTML_URL"
          elif [ "$EVENT_NAME" = "pull_request_review" ]; then
            COMMENT_TEXT="${{ github.event.review.body }}"
            TARGET_URL="${{ github.event.review.html_url }}"
          else
            COMMENT_TEXT="${{ github.event.comment.body }}"
            TARGET_URL="${{ github.event.comment.html_url }}"
          fi

          if [ -z "$COMMENT_TEXT" ] || [ "$COMMENT_TEXT" = "null" ]; then
            COMMENT_TEXT="Memberikan catatan ulasan lampiran berkas..."
          fi

          REPO_URL="${{ github.server_url }}/$GITHUB_REPOSITORY/tree/$PR_BRANCH"
          STAT_BOX="🔢 ${TOTAL_COMMITS} commits"$'\n'"📂 ${CHANGED_FILES} files"
          FORMATTED_COMMENT=$(printf '```\n%s\n```' "$COMMENT_TEXT")

          jq -n \
            --arg title "$TITLE" \
            --arg desc "$DESC" \
            --arg color "16239121" \
            --arg repo_name "$GITHUB_REPOSITORY" \
            --arg repo_url "$REPO_URL" \
            --arg doc_title "$PR_TITLE" \
            --arg doc_num "#$PR_NUMBER" \
            --arg doc_url "$TARGET_URL" \
            --arg actor "$USER_ACTOR" \
            --arg stats "$STAT_BOX" \
            --arg body "$FORMATTED_COMMENT" \
            --arg footer_text "$FOOTER" \
            --arg branch "$PR_BRANCH" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                color: ($color | tonumber),
                fields: [
                  { name: "🏰 Lokasi Pemeriksaan", value: ("[" + $repo_name + " (" + $branch + ")](" + $repo_url + ")"), inline: false },
                  { name: "💼 Judul Perjanjian PR", value: ("[*Nomor Berkas: " + $doc_num + "*](" + $doc_url + ")"), inline: false },
                  { name: "📝 Isi Ulasan / Isi Komentar", value: $body, inline: false },
                  { name: "📊 Ringkasan Berkas", value: $stats, inline: true },
                  { name: "👤 Peninjau Kontrak", value: ("`" + $actor + "`"), inline: true }
                ],
                footer: { text: $footer_text }
              }]
            }' > pr_payload.json

          curl -H "Content-Type: application/json" \
               -X POST \
               -d @pr_payload.json \
               "$DISCORD_URL"
