name: Update Weather
on:
  workflow_dispatch:
  # Menerima pemicu otomatis untuk run ulang jika terjadi error 443
  repository_dispatch:
    types: [retry-weather-443]
  schedule:
  - cron: '*/30 * * * *'

jobs:
  update-weather:
    runs-on: ubuntu-latest
    env:
      SECRET_LAT: ${{ secrets.SECRET_LAT }}
      SECRET_LON: ${{ secrets.SECRET_LON }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run update script with selective 443 retry
        shell: bash
        run: |
          ATTEMPTS=3
          DELAY=15
          count=1

          until [ $count -gt $ATTEMPTS ]
          do
            echo "Percobaan $count dari $ATTEMPTS..."
            
            set +e
            python weather.py 2> error.log
            EXIT_CODE=$?
            set -e

            if [ $EXIT_CODE -eq 0 ]; then
              echo "Script berhasil dijalankan."
              break
            fi

            if grep -q "443" error.log; then
              echo "Peringatan: Terjadi kesalahan koneksi 443."
              cat error.log
              
              if [ $count -ne $ATTEMPTS ]; then
                echo "Mencoba kembali dalam $DELAY detik..."
                sleep $DELAY
              fi
              ((count++))
            else
              echo "Kritis: Script gagal karena error non-443. Membatalkan proses."
              cat error.log
              exit $EXIT_CODE
            fi
          done

          # Jika setelah 3 kali percobaan cepat di atas masih gagal karena 443:
          if [ $count -gt $ATTEMPTS ]; then
            echo "Error: Gagal mendulang sukses setelah $ATTEMPTS percobaan cepat."
            echo "Memicu sistem penjadwalan eksekusi ulang 5 menit ke depan..."
            exit 1
          fi

      - name: Commit and Push changes
        uses: EndBug/add-and-commit@latest
        with:
          author_name: TheKingTermux
          author_email: 50316075+TheKingTermux@://github.com
          message: "Otomatis: Update cuaca terbaru"
          add: 'README.md status.json'

  # JOB BARU: Mengatur penjadwalan 5 menit tanpa memakan kuota menit runner aktif
  auto-retry-scheduler:
    runs-on: ubuntu-latest # Butuh ubuntu-latest karena memakai GitHub Action eksternal
    needs: update-weather
    if: failure() # Hanya jalan jika job 'update-weather' di atas mengalami kegagalan total
    steps:
      - name: Mengantre eksekusi ulang dalam 5 menit
        uses: mscoutermarsh/sleep-action@v1.2.0
        with:
          duration: 300 # Menunggu selama 300 detik (5 menit) sebelum menembak API

      - name: Trigger Re-run via Repository Dispatch
        run: |
          curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
               -H "Accept: application/vnd.github.v3+json" \
               -X POST \
               -d '{"event_type": "retry-weather-443"}' \
               "https://github.com{{ github.repository }}/dispatches"
