name: Update Weather
on:
  workflow_dispatch:
  # Menerima pemicu otomatis untuk run ulang jika terjadi error 443
  repository_dispatch:
    types: [retry-weather-443]
  schedule:
  - cron: '*/30 * * * *'

jobs:
  update-weather:
    runs-on: ubuntu-latest
    env:
      SECRET_LAT: ${{ secrets.SECRET_LAT }}
      SECRET_LON: ${{ secrets.SECRET_LON }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run update script with selective 443 retry
        shell: bash
        run: |
          ATTEMPTS=3
          DELAY=15
          count=1

          until [ $count -gt $ATTEMPTS ]
          do
            echo "Percobaan $count dari $ATTEMPTS..."
            
            set +e
            python weather.py 2> error.log
            EXIT_CODE=$?
            set -e

            if [ $EXIT_CODE -eq 0 ]; then
              echo "Script berhasil dijalankan."
              break
            fi

            if grep -q "443" error.log; then
              echo "Peringatan: Terjadi kesalahan koneksi 443."
              cat error.log
              
              if [ $count -ne $ATTEMPTS ]; then
                echo "Mencoba kembali dalam $DELAY detik..."
                sleep $DELAY
              fi
              ((count++))
            else
              echo "Kritis: Script gagal karena error non-443. Membatalkan proses."
              cat error.log
              exit $EXIT_CODE
            fi
          done

          # Jika setelah 3 kali percobaan cepat di atas masih gagal karena 443:
          if [ $count -gt $ATTEMPTS ]; then
            echo "Error: Gagal mendulang sukses setelah $ATTEMPTS percobaan cepat."
            echo "Memicu sistem penjadwalan eksekusi ulang 5 menit ke depan..."
            exit 1
          fi

      - name: Commit and Push changes
        uses: EndBug/add-and-commit@latest
        with:
          author_name: TheKingTermux
          author_email: 50316075+TheKingTermux@://github.com
          message: "Otomatis: Update cuaca terbaru"
          add: 'README.md status.json'

  # JOB BARU: Mengatur penjadwalan 5 menit dengan pembatas maksimal 3x loop
  auto-retry-scheduler:
    runs-on: ubuntu-latest
    needs: update-weather
    if: failure()
    steps:
      - name: Cek Batas Loop Retry
        id: check_retry
        run: |
          # Ambil hitungan retry dari trigger sebelumnya. Jika kosong (dari cron), anggap 0.
          CURRENT_RETRY="${{ github.event.client_payload.retry_count }}"
          CURRENT_RETRY=${CURRENT_RETRY:-0}
          
          echo "Status saat ini: Gagal pada percobaan ke-$CURRENT_RETRY."
          
          if [ "$CURRENT_RETRY" -ge 3 ]; then
            echo "Batas maksimal retry (3x) telah tercapai. Menghentikan loop darurat."
            echo "continue=false" >> $GITHUB_OUTPUT
          else
            NEXT_RETRY=$((CURRENT_RETRY + 1))
            echo "Akan mencoba retry ke-$NEXT_RETRY setelah 5 menit."
            echo "next_retry=$NEXT_RETRY" >> $GITHUB_OUTPUT
            echo "continue=true" >> $GITHUB_OUTPUT
          fi

      - name: Mengantre eksekusi ulang dalam 5 menit (Native Sleep)
        if: steps.check_retry.outputs.continue == 'true'
        run: |
          echo "Menunggu selama 5 menit sebelum pemicuan ulang..."
          sleep 300

      - name: Generate Bot Token
        if: steps.check_retry.outputs.continue == 'true'
        id: get_bug_bot_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Trigger Re-run via Repository Dispatch
        if: steps.check_retry.outputs.continue == 'true'
        env:
          NEXT_RETRY_COUNT: ${{ steps.check_retry.outputs.next_retry }}
          BOT_TOKEN: ${{ steps.get_bug_bot_token.outputs.token }}
        run: |
          curl -H "Authorization: Bearer $BOT_TOKEN" \
               -H "Accept: application/vnd.github.v3+json" \
               -X POST \
               -d '{"event_type": "retry-weather-443", "client_payload": {"retry_count": '"$NEXT_RETRY_COUNT"'}}' \
               "https://api.github.com/repos/${{ github.repository }}/dispatches"
