name: Monitor Issues
on:
  issues:
    types: [opened, closed]
  issue_comment:
    types: [created]

permissions:
  actions: read
  issues: read

jobs:
  kirim-notifikasi-sidang:
    runs-on: ubuntu-slim
    # BENTENG PENGAMAN MUTLAK: Langsung matikan mesin runner (Skipped) jika terdeteksi ada objek pull_request di dalam isu
    if: github.event.issue.pull_request == null
    steps:
      - name: Kirim Notifikasi Sandiwara Ruang Sidang via JQ
        run: |
          REPO_NAME="${{ github.repository }}"
          REPO_URL="${{ github.server_url }}/$REPO_NAME"
          EVENT_NAME="${{ github.event_name }}"
          ACTION="${{ github.event.action }}"
          ISSUE_TITLE="${{ github.event.issue.title }}"
          ISSUE_NUM="#${{ github.event.issue.number }}"
          ISSUE_URL="${{ github.event.issue.html_url }}"
          ACTOR="${{ github.actor }}"

          INDEX=$((RANDOM % 4))

          if [ "$EVENT_NAME" = "issues" ]; then
            if [ "$ACTION" = "opened" ]; then
              FURINA_DIALOG="🎭 **Lady Furina:**\n\"Astaga, Neuvillette! Lihat itu! Seseorang mengajukan tuntutan keluhan baru di panggung megah kita! Apakah ini sebuah tantangan terbuka untuk keadilanku?! Bersiaplah, seluruh penonton teater kini tertuju pada kasus \`$ISSUE_NUM\` ini!~\""
              NEUVI_DIALOG="⚖️ **Monsieur Neuvillette:**\n\"Harap tenang, Lady Furina. Berdasarkan konstitusi repositori, warga \`$ACTOR\` memang berhak melaporkan masalah demi kebaikan bersama. Mari kita catat berkas perkara ini dan memeriksanya secara objektif.\""
            else
              FURINA_DIALOG="🎭 **Lady Furina:**\n\"Tepuk tangan yang meriah, silakan! Kasus hukum \`$ISSUE_NUM\` resmi diselesaikan berkat kejeniusanku yang tiada tanding! Pertunjukan yang luar biasa dan berakhir dengan sangat indah, bukan?~\""
              NEUVI_DIALOG="⚖️ **Monsieur Neuvillette:**\n\"Penyelesaian berkas ini adalah hasil dari evaluasi yang matang, bukan sekadar pertunjukan teater. Tuntutan oleh \`$ACTOR\` ditutup, dan keharmonisan sistem telah dipulihkan sebagaimana mestinya.\""
            fi
          else
            if [ $INDEX -eq 0 ]; then
              FURINA_DIALOG="🎭 **Lady Furina:**\n\"Astaga! Seseorang baru saja mengirimkan surat kesaksian rahasia di tengah jalannya sidang! Lihat ini, \`$ACTOR\` berani menyuarakan pendapatnya langsung di panggung utamaku! Drama ini semakin menarik!~\""
              NEUVI_DIALOG="⚖️ **Monsieur Neuvillette:**\n\"Garda keamanan tidak perlu melakukan intervensi. Saksi \`$ACTOR\` memiliki hak menambahkan bukti baru pada perkara $ISSUE_NUM. Mari kita pelajari dokumen argumen ini secara rasional.\""
            elif [ $INDEX -eq 1 ]; then
              FURINA_DIALOG="🎭 **Lady Furina:**\n\"Tunggu, hentikan musiknya! Jangan bilang orang bernama \`$ACTOR\` ini berniat merebut sorotan lampu panggung dariku dengan komentar tambahan itu?! Neuvillette, lakukan sesuatu!\""
              NEUVI_DIALOG="⚖️ **Monsieur Neuvillette:**\n\"Duduklah kembali di kursimu, Lady Furina. Apa yang dilakukan \`$ACTOR\` adalah bagian dari diskusi sehat. Biarkan saya menelaah isi dari ulasan tersebut tanpa gangguan.\""
            elif [ $INDEX -eq 2 ]; then
              FURINA_DIALOG="🎭 **Lady Furina:**\n\"Eh? T-tunggu sebentar... Apa maksud dari kalimat rumit yang diketik oleh \`$ACTOR\` ini? Sulit dimengerti! Tapi sebagai Archon yang bijaksana, tentu saja aku... ehem, pura-pura paham!\""
              NEUVI_DIALOG="⚖️ **Monsieur Neuvillette:**\n\"*Helaan napas berat...* Jika Anda membaca dengan teliti, \`$ACTOR\` sedang memberikan ulasan teknis yang krusial untuk perbaikan bug. Saya akan merangkum esensinya untuk Anda.\""
            else
              FURINA_DIALOG="🎭 **Lady Furina:**\n\"Oho! Ketegangan di ruang sidang semakin memuncak! \`$ACTOR\` baru saja melemparkan argumen baru yang sangat tajam ke dalam diskusi! Penonton di balkon mulai berteriak histeris!~\""
              NEUVI_DIALOG="⚖️ **Monsieur Neuvillette:**\n\"Persidangan ini adalah tempat mencari kebenaran, bukan ajang hiburan sirkus. Kita harus tetap menghormati dedikasi \`$ACTOR\` dalam memberikan sudut pandang baru pada berkas $ISSUE_NUM.\""
            fi
          fi

          if [ "$EVENT_NAME" = "issue_comment" ]; then
            COMMENT_BODY="${{ github.event.comment.body }}"
            FIELD_NAME="📄 Isi Kesaksian / Komentar"
            FIELD_VALUE="\`\`\`\n$COMMENT_BODY\n\`\`\`"
          else
            FIELD_NAME="👤 Pemohon Kasus"
            FIELD_VALUE="\`$ACTOR\`"
          fi

          jq -n \
            --arg title "🏛️ Ruang Sidang Fontaine: Perkembangan Berkas" \
            --arg desc "($FURINA_DIALOG\n\n$NEUVI_DIALOG)" \
            --arg repo_name "$REPO_NAME" \
            --arg repo_url "$REPO_URL" \
            --arg issue_title "$ISSUE_TITLE" \
            --arg issue_num "$ISSUE_NUM" \
            --arg issue_url "$ISSUE_URL" \
            --arg f_name "$FIELD_NAME" \
            --arg f_val "$FIELD_VALUE" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                color: 2456538,
                fields: [
                  { name: "🏰 Lokasi Sidang", value: ("[" + $repo_name + "](" + $repo_url + ")"), inline: false },
                  { name: "📌 Berkas Bahasan", value: ("[" + $issue_title + " " + $issue_num + "](" + $issue_url + ")"), inline: false },
                  { name: $f_name, value: $f_val, inline: false }
                ],
                footer: { text: "⚖️ \"Hukum tidak memandang bulu, dan tirai pertunjukan tidak akan diturunkan.\"" }
              }]
            }' > comment_payload.json

          curl -H "Content-Type: application/json" \
               -X POST \
               -d @comment_payload.json \
               "${{ secrets.DISCORD_WEBHOOK_ISSUES }}"
