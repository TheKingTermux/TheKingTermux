name: Metrics
on:
  schedule: [{cron: "0 1 * * *"}]
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          commits_authoring: TheKingTermux, 50316075+TheKingTermux@users.noreply.github.com
          committer_message: "Otomatis: Update github-metrics.svg"
          
          # Langsung simpan ke folder picture tanpa perlu dipindah-pindah manual
          filename: picture/github-metrics.svg

          # Options
          user: TheKingTermux
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Jakarta
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C
          plugin_activity: yes
          plugin_activity_days: 14
          plugin_activity_filter: all
          plugin_activity_limit: 5
          plugin_activity_load: 300
          plugin_activity_visibility: all
          plugin_anilist: yes
          plugin_anilist_limit: 4
          plugin_anilist_limit_characters: 88
          plugin_anilist_medias: anime, manga
          plugin_anilist_sections: favorites, characters, watching
          plugin_anilist_shuffle: yes
          plugin_anilist_user: TheKingTermux
          plugin_followup: yes
          plugin_followup_archived: yes
          plugin_followup_sections: repositories
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 24
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          plugin_lines: yes
          plugin_notable: yes
          plugin_notable_from: organization
          plugin_notable_types: commit
          plugin_repositories: yes
          plugin_repositories_featured: TheKingTermux/extensions-source, TheKingTermux/tachiyomi-extensions, TheKingTermux/alice, TheKingTermux/myanimelist-nekopoi-scrapper, TheKingTermux/nekopoi-renamer, TheKingTermux/Website-Pengaduan-Masyarakat-Remake, UKKWariors/Website-Pengaduan-Masyarakat-Remake
          retries: 3
          retries_delay: 300
          retries_output_action: 5
          retries_delay_output_action: 120
